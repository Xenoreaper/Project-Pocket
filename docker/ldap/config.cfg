# GLAuth configuration for the local test LDAP server.
#
# GLAuth is a small LDAP server that reads its users from this file. It is
# started by `docker compose --profile ldap up -d` and exists only so the LDAP
# login can be tried and tested without a real directory. The passwords below
# are public test values: never expose this server to a network.
#
# Resulting entries (base DN dc=pocket,dc=test):
#   cn=pocket-service,ou=services,dc=pocket,dc=test   may search, password "pocket-service"
#   cn=demo,ou=people,dc=pocket,dc=test               a user,     password "pocket-demo"

[ldap]
  enabled = true
  # Plain LDAP inside the Compose network. Real servers should use ldaps://.
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  # "config" means: the users are the [[users]] blocks of this file.
  datastore = "config"
  baseDN = "dc=pocket,dc=test"

[behaviors]
  # Only users with a "search" capability may search (the service account).
  IgnoreCapabilities = false
  # GLAuth can block a client after failed binds. Tests send wrong passwords on
  # purpose, so the block is off here.
  LimitFailedBinds = false

# The service account Pocket uses to look a user up before checking the password.
[[users]]
  name = "pocket-service"
  uidnumber = 5001
  primarygroup = 5501
  # SHA-256 of the test password "pocket-service".
  passsha256 = "3f6ec449043267307f643078045d7c0f08dfacccbc59e14d62ec0f8b08bd5e30"
    [[users.capabilities]]
    action = "search"
    object = "*"

# A normal user for trying the login.
[[users]]
  name = "demo"
  givenname = "Demo"
  sn = "User"
  mail = "demo@example.com"
  uidnumber = 5002
  primarygroup = 5502
  # SHA-256 of the test password "pocket-demo".
  passsha256 = "9793fa8ee65c8acb8818468c41c0daec8d2d32a1249d84608c48678289149c2b"

# A group becomes the "ou" part of its members' DNs.
[[groups]]
  name = "services"
  gidnumber = 5501

[[groups]]
  name = "people"
  gidnumber = 5502
