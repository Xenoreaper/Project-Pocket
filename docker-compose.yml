# Project Pocket — local/production stack.
#
# `docker compose up --build` starts the backend and the web app.
# All tooling (pnpm, uv, tests) runs in the optional "tools" service:
#   docker compose run --rm -T tools pnpm install
# The "tools" profile means it is not started by `up` unless requested.
#
# Values such as ports come from .env (copy .env.example first).

name: project-pocket

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Absolute path inside the container; the volume below keeps it on the
      # host between restarts. Four slashes = absolute path.
      POCKET_DATABASE_URL: sqlite:////app/data/pocket.db
      POCKET_ENVIRONMENT: ${POCKET_ENVIRONMENT:-development}
      POCKET_CORS_ORIGINS: ${POCKET_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Accounts. Compose only passes variables listed here, so every new
      # backend setting must also be added to this list.
      POCKET_ALLOW_REGISTRATION: ${POCKET_ALLOW_REGISTRATION:-true}
      POCKET_TOKEN_LIFETIME_DAYS: ${POCKET_TOKEN_LIFETIME_DAYS:-30}
      # Optional Keycloak login; empty means local accounts only. See README,
      # "Keycloak login (optional)".
      POCKET_OIDC_ISSUER: ${POCKET_OIDC_ISSUER:-}
      POCKET_OIDC_CLIENT_ID: ${POCKET_OIDC_CLIENT_ID:-}
      POCKET_OIDC_JWKS_URL: ${POCKET_OIDC_JWKS_URL:-}
    ports:
      # Handy for API docs (http://localhost:8000/docs) and for the extension.
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - pocket-data:/app/data
    healthcheck:
      # Python is already in the image; urllib avoids installing curl.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      # The web build imports packages/shared, so the context must be the repo
      # root; the Dockerfile copies only what it needs.
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        # Wait until /api/health answers, otherwise nginx would briefly proxy
        # to a dead backend during the first page load.
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1, not "localhost": inside the container localhost may
      # resolve to IPv6 (::1) while nginx listens on IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Keycloak for testing (not started by `docker compose up`) ─────────────
  # Start with: docker compose --profile keycloak up -d
  # A throwaway Keycloak with the test realm from docker/keycloak/. It is for
  # development and demos only: start-dev uses an in-container database that
  # is reset whenever the container is recreated. Production setups connect
  # Pocket to their existing Keycloak instead (README).
  keycloak:
    profiles: ["keycloak"]
    # Pinned version, so both of us and the demo run the same Keycloak.
    image: quay.io/keycloak/keycloak:26.8.2
    # --import-realm loads every *.json in /opt/keycloak/data/import on start.
    command: ["start-dev", "--import-realm"]
    environment:
      # Admin console login (http://localhost:8080/admin). Test-only default;
      # change it in .env if the container is reachable by others.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The public address browsers use. Keycloak writes it into every token
      # as the issuer, so it must equal POCKET_OIDC_ISSUER without the realm.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      # Still answer the backend, which calls http://keycloak:8080 from
      # inside the Compose network to fetch the signing keys.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  # ── Developer tooling (not started by `docker compose up`) ────────────────
  tools:
    profiles: ["tools"]
    build:
      context: ./docker/tools
      dockerfile: Dockerfile
    working_dir: /workspace
    # Lets tools containers reach a backend running on the host (used by
    # `make dev-web`). Docker Desktop already provides this name; the explicit
    # mapping also makes it work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Source code from the host. node_modules/.venv are created here too, but
      # they are git-ignored and Linux-specific on purpose.
      - .:/workspace
      # Named volumes keep downloaded packages between runs (fast installs).
      - pnpm-store:/pnpm/store
      - uv-cache:/root/.cache/uv

volumes:
  pocket-data: # SQLite database file
  pnpm-store: # pnpm package cache
  uv-cache: # uv download cache
