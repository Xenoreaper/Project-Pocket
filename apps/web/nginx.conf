# nginx configuration for the production web container.
#
# It serves the built React app and forwards /api/* to the FastAPI container.
# The browser therefore always talks to one origin (no CORS in production).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths return index.html so client-side routing
    # keeps working after a page reload. (No router yet, but harmless.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Compose service named "backend" on port 8000.
    # The trailing slash in proxy_pass keeps the /api/... path.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and web manifest change on every deploy and must
    # never be served from a stale cache.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
