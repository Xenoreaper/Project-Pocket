<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Pocket - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Auth overlay (full screen for login page only) -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="modal auth-modal">
      <div class="auth-head">
        <div class="auth-head-top">
          <span class="auth-badge">Private Workspace</span>
          <div id="auth-theme-control" class="theme-slider theme-slider-compact auth-theme-slider" role="tablist" aria-label="Theme mode">
            <span class="theme-slider-thumb" aria-hidden="true"></span>
            <button type="button" class="theme-slider-option" data-theme-value="light" role="tab" aria-selected="false">Light</button>
            <button type="button" class="theme-slider-option" data-theme-value="dark" role="tab" aria-selected="true">Dark</button>
            <button type="button" class="theme-slider-option" data-theme-value="oled" role="tab" aria-selected="false">OLED</button>
          </div>
        </div>
        <h3 id="auth-title">Sign In</h3>
        <p class="settings-hint" id="auth-subtitle">Use your account to access your own saves.</p>
      </div>
      <div class="auth-mode-switch" role="tablist" aria-label="Authentication mode">
        <button type="button" id="auth-mode-login-btn" class="auth-mode-btn active" aria-selected="true">Sign In</button>
        <button type="button" id="auth-mode-register-btn" class="auth-mode-btn" aria-selected="false">Register</button>
      </div>
      <form id="auth-form">
        <label class="auth-field">Username
          <input type="text" id="auth-username" autocomplete="username" required minlength="3" maxlength="64" placeholder="Username" />
        </label>
        <label class="auth-field">Password
          <input type="password" id="auth-password" autocomplete="current-password" required minlength="8" placeholder="Password" />
        </label>
        <p id="auth-password-hint" class="auth-password-hint" style="display:none">Use at least 8 characters.</p>
        <label class="auth-field" id="auth-confirm-wrap" style="display:none">Confirm password
          <input type="password" id="auth-password-confirm" autocomplete="new-password" minlength="8" placeholder="Repeat your password" />
        </label>
        <button type="submit" class="btn-primary" id="auth-submit-btn">Sign In</button>
      </form>
      <p class="auth-footnote" id="auth-footnote">New here? Switch to Register above to create your account.</p>
      <p id="auth-status" class="settings-status"></p>
    </div>
  </div>

  <!-- Forced password change modal -->
  <div id="force-password-change-modal" class="auth-overlay hidden">
    <div class="modal auth-modal">
      <div class="auth-head">
        <h3>Change Password</h3>
        <p class="settings-hint">Your password has been reset. Please create a new password to continue.</p>
      </div>
      <form id="force-password-change-form">
        <label class="auth-field">New password
          <input type="password" id="force-new-password" autocomplete="new-password" required minlength="8" placeholder="New password" />
        </label>
        <label class="auth-field">Confirm new password
          <input type="password" id="force-confirm-password" autocomplete="new-password" required minlength="8" placeholder="Confirm new password" />
        </label>
        <button type="submit" class="btn-primary">Update Password</button>
      </form>
      <p id="force-password-status" class="settings-status"></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
