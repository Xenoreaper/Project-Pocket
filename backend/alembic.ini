# Alembic configuration for database migrations.
#
# Alembic is the migration tool for SQLAlchemy/SQLModel. A migration is a
# versioned Python file that upgrades (or downgrades) the database schema.
# Commands (run inside backend/):
#   uv run alembic revision --autogenerate -m "add pages"
#   uv run alembic upgrade head
#
# The URL in this file is only a fallback: alembic/env.py overwrites it with
# POCKET_DATABASE_URL from app.config, so there is exactly one source of truth.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# Fallback used when Alembic is invoked without the app environment.
sqlalchemy.url = sqlite:///./data/pocket.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
