<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project Pocket</title>
  <style>
    :root {
      --bg: #1a1a24;
      --surface: #22222e;
      --surface-soft: #1f1f2a;
      --accent: #7c6af7;
      --text: #e8e8f0;
      --muted: #888898;
      --danger: #e05260;
      --border: #333344;
      --highlight-bg: rgba(124, 106, 247, .14);
      --focus-ring: rgba(124, 106, 247, .28);
      --option-hover: rgba(124, 106, 247, .2);
      --shadow: rgba(0,0,0,.35);
      --radius: 8px;
    }
    body[data-theme="light"] {
      --bg: #f3f6ff;
      --surface: #ffffff;
      --surface-soft: #eef3ff;
      --accent: #4668d8;
      --text: #1c2437;
      --muted: #5f6b86;
      --danger: #d6455b;
      --border: #c9d4ea;
      --highlight-bg: rgba(70, 104, 216, .12);
      --focus-ring: rgba(70, 104, 216, .24);
      --option-hover: rgba(70, 104, 216, .14);
      --shadow: rgba(34, 48, 84, .18);
      color-scheme: light;
    }
    body[data-theme="oled"] {
      --bg: #020203;
      --surface: #0a0a10;
      --surface-soft: #06060a;
      --accent: #8f7cff;
      --text: #cfcfd8;
      --muted: #9a9ab0;
      --danger: #ef5e72;
      --border: #18181f;
      --highlight-bg: rgba(143, 124, 255, .18);
      --focus-ring: rgba(143, 124, 255, .28);
      --option-hover: rgba(143, 124, 255, .22);
      --shadow: rgba(0,0,0,.65);
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: 320px;
      padding: 1rem;
    }
    h1 { font-size: 1rem; color: var(--accent); margin-bottom: 1rem; }
    label {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .7rem;
    }
    input, textarea, select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .45rem .7rem;
      border-radius: var(--radius);
      font-size: .85rem;
      outline: none;
      width: 100%;
      font-family: inherit;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    input:not([type=checkbox]):hover,
    textarea:hover,
    select:hover {
      border-color: var(--accent);
      background: var(--highlight-bg);
    }
    input:not([type=checkbox]):focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .row { display: flex; align-items: center; gap: .5rem; margin-bottom: .7rem; }
    .option-row { display: flex; gap: 1rem; margin-bottom: .7rem; flex-wrap: wrap; }
    .option-row .row { margin-bottom: 0; }
    .row input[type=checkbox] { width: auto; }
    .row label { margin: 0; color: var(--text); font-size: .85rem; flex-direction: row; }
    .host-row {
      font-size: .7rem;
      color: var(--muted);
      margin-bottom: .9rem;
      display: flex;
      gap: .4rem;
      align-items: center;
    }
    .host-row input { font-size: .7rem; padding: .3rem .6rem; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: .55rem 1.2rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .875rem;
      font-weight: 600;
      width: 100%;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .08s ease, opacity .2s;
    }
    button:not(.suggestion-option):not(.suggestion-arrow-btn):hover {
      opacity: 1;
      transform: translateY(-1px);
    }
    button:not(.suggestion-option):not(.suggestion-arrow-btn):active {
      transform: translateY(0);
    }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .actions-row {
      display: flex;
      gap: .5rem;
    }
    .actions-row button {
      width: auto;
      flex: 1;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: var(--highlight-bg);
      opacity: 1;
    }
    #status { margin-top: .75rem; font-size: .8rem; color: var(--accent); text-align: center; min-height: 1.1rem; }
    .settings-toggle {
      background: transparent;
      color: var(--muted);
      font-size: .75rem;
      width: auto;
      padding: 0;
      margin-top: .5rem;
      text-decoration: underline;
    }
    .settings-toggle:hover {
      color: var(--text);
      opacity: 1;
      transform: none;
    }
    #settings-panel { display: none; margin-top: .75rem; }
    #settings-panel.open { display: block; }
    #settings-panel .profile-settings-label {
      margin-top: .85rem;
    }
    #settings-panel .theme-settings-label {
      margin-top: .45rem;
    }
    .auth-prompt {
      margin-top: .7rem;
      padding: .55rem .65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--muted);
      font-size: .78rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }
    .auth-prompt button {
      width: auto;
      padding: .35rem .65rem;
      font-size: .78rem;
    }
    #auth-login-panel,
    #auth-logout-panel {
      margin-top: .15rem;
    }
    #save-ui { display: none; }
    .auth-only-panel {
      display: block;
      margin-top: .35rem;
      padding: .7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }
    .auth-only-panel p {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .65rem;
    }
    .suggestion-combobox {
      position: relative;
      width: 100%;
    }
    .suggestion-combobox input {
      padding-right: 2rem;
    }
    .suggestion-combobox:hover input,
    .suggestion-combobox:focus-within input {
      border-color: var(--accent);
      background: var(--highlight-bg);
    }
    .suggestion-arrow-btn {
      position: absolute;
      right: .5rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1rem;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 0;
      line-height: 1;
      font-size: .78rem;
      cursor: pointer;
      transition: color .15s ease, transform .15s ease;
    }
    .suggestion-arrow-btn:hover { color: var(--text); opacity: 1; }
    .suggestion-arrow-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .suggestion-combobox:hover .suggestion-arrow-btn,
    .suggestion-combobox:focus-within .suggestion-arrow-btn {
      color: var(--text);
    }
    .suggestion-arrow-btn.open { transform: translateY(-50%) rotate(180deg); }
    .suggestion-dropdown {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + .2rem);
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 10px 20px var(--shadow);
      z-index: 20;
    }
    .suggestion-dropdown.open { display: block; }
    .suggestion-option {
      display: block;
      width: 100%;
      border: none;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: .5rem .7rem;
      font-size: .84rem;
      cursor: pointer;
    }
    .suggestion-option:first-child { border-top: none; }
    .suggestion-option:hover,
    .suggestion-option.active {
      background: var(--option-hover);
      opacity: 1;
    }
    .suggestion-option:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 2px var(--focus-ring);
    }
    .suggestion-empty {
      padding: .5rem .7rem;
      color: var(--muted);
      font-size: .8rem;
    }
  </style>
</head>
<body>
  <h1>📌 Project Pocket</h1>

  <div id="save-ui">
    <label>Title
      <input type="text" id="title" placeholder="Title" />
    </label>

    <label>Tags (comma-separated)
      <div class="suggestion-combobox">
        <input type="text" id="tags" placeholder="cooking, reference…" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="tags-dropdown" />
        <button id="tags-dropdown-toggle" class="suggestion-arrow-btn" type="button" aria-label="Toggle tag suggestions" aria-expanded="false" aria-controls="tags-dropdown">
          <span aria-hidden="true">▾</span>
        </button>
        <div id="tags-dropdown" class="suggestion-dropdown" role="listbox" aria-label="Suggested tags"></div>
      </div>
    </label>

    <label id="yt-time-row">YouTube timestamp
      <input type="text" id="yt-time" placeholder="e.g. 1:23 or 83" />
    </label>

    <label>Notes
      <textarea id="notes" rows="2" placeholder="Your notes…"></textarea>
    </label>

    <div class="option-row">
      <div class="row">
        <input type="checkbox" id="is-recipe" />
        <label for="is-recipe">Recipe</label>
      </div>

      <div class="row">
        <input type="checkbox" id="is-music" />
        <label for="is-music">Music</label>
      </div>
    </div>

    <div class="actions-row">
      <button id="save-btn">Save Page</button>
      <button id="open-pocket-btn" class="btn-secondary">Open Pocket</button>
    </div>
  </div>

  <div id="auth-only-panel" class="auth-only-panel">
    <p>Please sign in to save pages.</p>
    <label>Login username
      <input type="text" id="auth-username" placeholder="Username" autocomplete="username" />
    </label>
    <label>Login password
      <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" />
    </label>
    <button id="auth-login-btn">Sign In</button>
  </div>
  <p id="status"></p>

  <button class="settings-toggle" id="settings-toggle" style="display:none">⚙ Settings</button>
  <div id="settings-panel">
    <label>Pocket server URL
      <input type="url" id="server-url" placeholder="http://localhost:3000" />
    </label>
    <div id="auth-logout-panel" style="display:none">
      <p id="auth-info" style="margin-bottom:.55rem;font-size:.78rem;color:var(--muted);min-height:1rem"></p>
      <button id="auth-logout-btn" class="btn-secondary">Logout</button>
    </div>
    <label class="profile-settings-label">Profile
      <div class="suggestion-combobox">
        <input type="text" id="pocket-user" maxlength="64" placeholder="default" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="profile-dropdown" />
        <button id="profile-dropdown-toggle" class="suggestion-arrow-btn" type="button" aria-label="Toggle profile suggestions" aria-expanded="false" aria-controls="profile-dropdown">
          <span aria-hidden="true">▾</span>
        </button>
        <div id="profile-dropdown" class="suggestion-dropdown" role="listbox" aria-label="Saved profiles"></div>
      </div>
    </label>
    <label class="theme-settings-label">Theme
      <select id="theme-mode" aria-label="Popup theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="oled">OLED</option>
      </select>
    </label>
    <button id="save-settings" style="margin-top:.3rem">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
